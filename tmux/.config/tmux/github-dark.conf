# github dark dimmed. bg #22272e, inset #1c2128, fg #adbac7, purple #b083f0,
# blue #539bf5, red #f47067, green #57ab5a, muted #768390, border #444c56.
set -g window-style "fg=#adbac7,bg=#22272e"
set -g status-style "bg=#1c2128,fg=#adbac7"
set -g status-left "#[bg=#b083f0,fg=#22272e,bold] #S #[bg=#1c2128] "
set -g status-right "#{?client_prefix,#[bg=#f47067#,fg=#22272e#,bold] PREFIX #[default] ,}#[fg=#768390]%H:%M #[bg=#57ab5a,fg=#22272e,bold] #h "
setw -g window-status-format "#[fg=#768390] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#b083f0,bold] #I:#W#{?window_zoomed_flag, #[fg=#539bf5]Z#[fg=#b083f0],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#444c56"
set -g pane-active-border-style "fg=#b083f0"
set -g message-style "bg=#1c2128,fg=#adbac7"
set -g mode-style "bg=#b083f0,fg=#22272e"
