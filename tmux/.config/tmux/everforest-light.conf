# everforest light (medium). bg0 #fdf6e3, bg_dim #efebd4, fg #5c6a72, purple #df69ba,
# blue #3a94c5, red #f85552, aqua #35a77c, grey1 #939f91, bg4 #e0dcc7.
set -g window-style "fg=#5c6a72,bg=#fdf6e3"
set -g status-style "bg=#efebd4,fg=#5c6a72"
set -g status-left "#[bg=#df69ba,fg=#fdf6e3,bold] #S #[bg=#efebd4] "
set -g status-right "#{?client_prefix,#[bg=#f85552#,fg=#fdf6e3#,bold] PREFIX #[default] ,}#[fg=#939f91]%H:%M #[bg=#35a77c,fg=#fdf6e3,bold] #h "
setw -g window-status-format "#[fg=#939f91] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#df69ba,bold] #I:#W#{?window_zoomed_flag, #[fg=#3a94c5]Z#[fg=#df69ba],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#e0dcc7"
set -g pane-active-border-style "fg=#df69ba"
set -g message-style "bg=#efebd4,fg=#5c6a72"
set -g mode-style "bg=#df69ba,fg=#fdf6e3"
