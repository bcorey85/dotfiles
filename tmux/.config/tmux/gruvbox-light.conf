# gruvbox light (medium). bg0 #fbf1c7, bg1 #ebdbb2, fg #3c3836, purple #8f3f71,
# blue #076678, red #9d0006, aqua #427b58, gray #7c6f64, bg3 #bdae93.
set -g window-style "fg=#3c3836,bg=#fbf1c7"
set -g status-style "bg=#ebdbb2,fg=#3c3836"
set -g status-left "#[bg=#8f3f71,fg=#fbf1c7,bold] #S #[bg=#ebdbb2] "
set -g status-right "#{?client_prefix,#[bg=#9d0006#,fg=#fbf1c7#,bold] PREFIX #[default] ,}#[fg=#7c6f64]%H:%M #[bg=#427b58,fg=#fbf1c7,bold] #h "
setw -g window-status-format "#[fg=#7c6f64] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#8f3f71,bold] #I:#W#{?window_zoomed_flag, #[fg=#076678]Z#[fg=#8f3f71],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#bdae93"
set -g pane-active-border-style "fg=#8f3f71"
set -g message-style "bg=#ebdbb2,fg=#3c3836"
set -g mode-style "bg=#8f3f71,fg=#fbf1c7"
