# Gradual evening warm-down (was a single hard 21:00 jump to 4000K).
# Eye-fatigue is worst in the evenings, so ramp the colour temperature down in
# steps through the evening instead of one abrupt shift, and end warmer (3200K).

# gamma = 0.60 (a fraction; 60 fails as 6000%) in every profile: the OLED's white text reads harsh, and dimming
# here leaves the backlight higher than dimming with brightnessctl alone.

profile {
    time = 6:30
    identity = true
    gamma = 0.60
}

profile {
    time = 18:00
    temperature = 5000
    gamma = 0.60
}

profile {
    time = 20:00
    temperature = 4000
    gamma = 0.60
}

profile {
    time = 22:00
    temperature = 3200
    gamma = 0.60
}
