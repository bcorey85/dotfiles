# lazygit config
# Schema: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#
# Global git `core.pager` is untouched -- plain `git diff` outside lazygit still
# goes through delta with its own settings.
#
# No "Press enter to return to lazygit" pause after a subprocess exits. The
# prompt exists so you can read subprocess output; our subprocesses are
# full-screen TUIs with nothing to read on exit.
promptToReturnFromSubprocess: false
os:
  # Without this lazygit falls back to bare `vim`, which is not installed --
  # nvim only. The failed subprocess then forces the return prompt above
  # regardless of the setting, because a nonzero exit has output worth reading.
  editPreset: nvim
gui:
  # Reclaim horizontal space for the diff. The side panel is narrow while you
  # read a diff and only widens when you focus it.
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  # Open with all panels visible. `+` (nextScreenMode) steps up through half
  # (file list dominant) and full (diff hidden entirely); `_` steps back down.
  screenMode: normal
git:
  # `paging`, singular — lazygit has one pager slot (config.PagingConfig), not a
  # list of candidates. A `pagers:` list parses as an unknown key and silently
  # leaves the pager empty.
  paging:
    # hunk detects lazygit's captured-pager host (no controlling terminal) and
    # emits a static coloured diff instead of launching its TUI. That path
    # honours ~/.config/hunk/config.toml for theme, line numbers and hunk
    # headers -- which is the point: `theme-mode` writes that theme key, so the
    # diff panel follows dark/light. Delta's own theme is hardcoded dark and
    # never did.
    #
    # No --mode split: the static renderer parses the flag and ignores it,
    # always building stacked rows (modem-dev/hunk#338). Passing it reads as a
    # broken config rather than an upstream gap. Revisit when that lands.
    colorArg: always
    pager: hunk pager
