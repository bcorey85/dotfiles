# onedark light — the darker family's light side is navarasu's stock "light"
# style (only dark drops to #1f2329). Hex-for-hex with
# tmux/.config/tmux/onedark-darker-light.conf: canvas #fafafa, status inset
# #f0f0f0, fg #383a42, border #dcdcdc, purple #a626a4, blue #4078f2,
# red #e45649, green #50a14f, yellow #c18401, cyan #0184bc.
#
# Muted is #696a71 — onedark's grey #a0a1a7 darkened toward fg, because the
# stock grey is only 2.26:1 on #f0f0f0 (floor 4.5) and this is 4.65:1. Same
# fixup the tmux and herdr light palettes apply.
#
# syntax_theme omitted so tuicr resolves its bundled LIGHT syntax theme from
# panel_bg.

panel_bg = "#fafafa"
bg_highlight = "#e5e5e6"
fg_primary = "#383a42"
fg_secondary = "#696a71"
fg_dim = "#77787f"

diff_add = "#50a14f"
diff_add_bg = "#e6f0e0"
diff_del = "#e45649"
diff_del_bg = "#fae3e1"
diff_context = "#383a42"
diff_hunk_header = "#4078f2"
expanded_context_fg = "#77787f"

syntax_add_bg = "#e6f0e0"
syntax_del_bg = "#fae3e1"

file_added = "#50a14f"
file_modified = "#c18401"
file_deleted = "#e45649"
file_renamed = "#a626a4"

reviewed = "#50a14f"
pending = "#c18401"

comment_note = "#4078f2"
comment_suggestion = "#0184bc"
comment_issue = "#e45649"
comment_praise = "#50a14f"

border_focused = "#a626a4"
border_unfocused = "#dcdcdc"
status_bar_bg = "#f0f0f0"
cursor_color = "#000000"
cursor_line_bg = "#f0f0f0"
branch_name = "#a626a4"
help_indicator = "#696a71"

message_info_fg = "#fafafa"
message_info_bg = "#4078f2"
message_warning_fg = "#fafafa"
message_warning_bg = "#c18401"
message_error_fg = "#fafafa"
message_error_bg = "#e45649"
update_badge_fg = "#fafafa"
update_badge_bg = "#c18401"

mode_fg = "#fafafa"
mode_bg = "#a626a4"
