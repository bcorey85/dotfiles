# catppuccin macchiato. base #24273a, mantle #1e2030, text #cad3f5, mauve #c6a0f6,
# blue #8aadf4, red #ed8796, teal #8bd5ca, overlay1 #8087a2, surface1 #494d64.
set -g window-style "fg=#cad3f5,bg=#24273a"
set -g status-style "bg=#1e2030,fg=#cad3f5"
set -g status-left "#[bg=#c6a0f6,fg=#24273a,bold] #S #[bg=#1e2030] "
set -g status-right "#{?client_prefix,#[bg=#ed8796#,fg=#24273a#,bold] PREFIX #[default] ,}#[fg=#8087a2]%H:%M #[bg=#8bd5ca,fg=#24273a,bold] #h "
setw -g window-status-format "#[fg=#8087a2] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#c6a0f6,bold] #I:#W#{?window_zoomed_flag, #[fg=#8aadf4]Z#[fg=#c6a0f6],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#494d64"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style "bg=#1e2030,fg=#cad3f5"
set -g mode-style "bg=#c6a0f6,fg=#24273a"
