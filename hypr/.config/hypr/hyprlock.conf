# flexoki dark (moon) palette (dark-only, no mode axis).
background {
    monitor =
    color = rgb(100f0f)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(4385be)
    inner_color = rgb(1c1b1a)
    font_color = rgb(cecdc3)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    fail_color = rgb(d14d41)
    fail_text = <i>$FAIL</i>
    halign = center
    valign = center
    position = 0, -50
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgb(4385be)
    font_size = 64
    font_family = FiraCode Nerd Font Mono
    halign = center
    valign = center
    position = 0, 100
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(878580)
    font_size = 16
    font_family = FiraCode Nerd Font Mono
    halign = center
    valign = center
    position = 0, 30
}
