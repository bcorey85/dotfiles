# github light default. bg #ffffff, subtle #f6f8fa, fg #24292f, purple #8250df,
# blue #0969da, red #cf222e, green #1a7f37, muted #6e7781, border #d0d7de.
set -g window-style "fg=#24292f,bg=#ffffff"
set -g status-style "bg=#f6f8fa,fg=#24292f"
set -g status-left "#[bg=#8250df,fg=#ffffff,bold] #S #[bg=#f6f8fa] "
set -g status-right "#{?client_prefix,#[bg=#cf222e#,fg=#ffffff#,bold] PREFIX #[default] ,}#[fg=#6e7781]%H:%M #[bg=#1a7f37,fg=#ffffff,bold] #h "
setw -g window-status-format "#[fg=#6e7781] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#8250df,bold] #I:#W#{?window_zoomed_flag, #[fg=#0969da]Z#[fg=#8250df],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#d0d7de"
set -g pane-active-border-style "fg=#8250df"
set -g message-style "bg=#f6f8fa,fg=#24292f"
set -g mode-style "bg=#8250df,fg=#ffffff"
