# onedark "darker" palette (dark-only, no mode axis).
background {
    monitor =
    color = rgb(1f2329)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(4fa6ed)
    inner_color = rgb(181b20)
    font_color = rgb(a0a8b7)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    fail_color = rgb(e55561)
    fail_text = <i>$FAIL</i>
    halign = center
    valign = center
    position = 0, -50
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgb(4fa6ed)
    font_size = 64
    font_family = CommitMono Nerd Font Mono
    halign = center
    valign = center
    position = 0, 100
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(858c9a)
    font_size = 16
    font_family = CommitMono Nerd Font Mono
    halign = center
    valign = center
    position = 0, 30
}
