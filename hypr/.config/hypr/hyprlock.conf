# monokai-pro "pro" filter palette (dark-only, no mode axis).
background {
    monitor =
    color = rgb(2d2a2e)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(78dce8)
    inner_color = rgb(221f22)
    font_color = rgb(fcfcfa)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    fail_color = rgb(ff6188)
    fail_text = <i>$FAIL</i>
    halign = center
    valign = center
    position = 0, -50
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgb(78dce8)
    font_size = 64
    font_family = FiraCode Nerd Font Mono
    halign = center
    valign = center
    position = 0, 100
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(949394)
    font_size = 16
    font_family = FiraCode Nerd Font Mono
    halign = center
    valign = center
    position = 0, 30
}
