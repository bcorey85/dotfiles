# Walker launcher config. Theme lives in themes/vitesse/style.css.
# elephant backend is autostarted by Hyprland (exec-once = elephant).
theme = "vitesse"

# Emacs-style list navigation alongside the arrow keys.
[keybinds]
next = ["Down", "ctrl n"]
previous = ["Up", "ctrl p"]

# Free ctrl n / ctrl p (default: pinup / pin) so the nav binds above win.
# This array replaces the default desktopapplications actions, so the
# start / new_instance entries are repeated verbatim; only pin/pinup move.
[providers.actions]
desktopapplications = [
  { action = "start", default = true, bind = "Return" },
  { action = "start:keep", label = "open+next", bind = "shift Return", after = "KeepOpen" },
  { action = "new_instance", label = "new instance", bind = "ctrl Return" },
  { action = "new_instance:keep", label = "new+next", bind = "ctrl alt Return", after = "KeepOpen" },
  { action = "pin", bind = "alt p", after = "AsyncReload" },
  { action = "unpin", bind = "alt p", after = "AsyncReload" },
  { action = "pinup", bind = "alt n", after = "AsyncReload" },
  { action = "pindown", bind = "alt m", after = "AsyncReload" },
]
