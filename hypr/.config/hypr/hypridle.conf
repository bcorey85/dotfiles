general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # dual lua/legacy dispatch: hyprctl always exits 0, so no fallback chaining possible;
    # the wrong-engine form errors harmlessly. Drop legacy forms once all machines run the lua config.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch dpms on; sleep 1; hyprctl reload
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off screen after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch dpms on
}

# Suspend after 30 minutes — only on battery-equipped machines
listener {
    timeout = 1800
    on-timeout = sh -c 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1 && systemctl suspend'
}
