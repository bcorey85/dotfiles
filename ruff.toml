target-version = "py314"
line-length = 120
include = [
    "claude/.claude/scripts/**/*.py",
    "claude/.claude/scripts/verify-log",
    "claude/.claude/scripts/verify-prep",
    "claude/.claude/skills/*/scripts/*.py",
    "tests/scripts/**/*.py",
]
extend-exclude = ["claude/.claude/skills/synced", "claude/.claude/skills/herdr", "claude/.claude/skills/tuios"]

[lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF"]

[lint.mccabe]
max-complexity = 10

# Every ignore is per file and says why. No rule is ignored for the whole tree.
[lint.per-file-ignores]
# These files put the scripts folder on sys.path first, so the sibling-module imports that follow cannot sit at the top.
"claude/.claude/skills/adr/scripts/adr_flow.py" = ["E402"]
"tests/scripts/test_code_step_asks.py" = ["E402"]
"tests/scripts/test_code_step_termination.py" = ["E402"]
"tests/scripts/test_shell_command.py" = ["E402"]
"tests/scripts/test_verify_common_review_ran.py" = ["E402"]
# A failed open() is reported on its own and the hook then exits 0, so open() stays outside the with block that
# covers the writes.
"claude/.claude/scripts/log_agent_usage.py" = ["SIM115"]
"claude/.claude/scripts/log_skill_use.py" = ["SIM115"]
"claude/.claude/scripts/test_edit_telemetry.py" = ["SIM115"]
# The en dash (U+2013) is the character the plan and heading parsers must accept, so the strings keep it.
"claude/.claude/scripts/code_step.py" = ["RUF001"]
"claude/.claude/scripts/plan_format.py" = ["RUF001"]
"claude/.claude/scripts/verify_common.py" = ["RUF001"]
"tests/scripts/test_adr_flow.py" = ["RUF001"]
"tests/scripts/test_code_step.py" = ["RUF001"]
# test_plan_format.py has two ignores, each with its own reason:
#   E402: the script folder comes from PLAN_FORMAT_SCRIPT, so plan_format can only be imported after sys.path is set.
#   RUF001: the en dash (U+2013) is the character the plan and heading parsers must accept, so the strings keep it.
"tests/scripts/test_plan_format.py" = ["E402", "RUF001"]
# The no-break space and em space are the whitespace characters the test feeds to the parser.
"tests/scripts/test_review_fixes.py" = ["RUF001"]
