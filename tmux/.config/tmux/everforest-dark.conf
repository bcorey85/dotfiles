# everforest dark (hard). bg0 #272e33, bg_dim #1e2326, fg #d3c6aa, purple #d699b6,
# blue #7fbbb3, red #e67e80, aqua #83c092, grey1 #859289, bg4 #4c565c.
set -g window-style "fg=#d3c6aa,bg=#272e33"
set -g status-style "bg=#1e2326,fg=#d3c6aa"
set -g status-left "#[bg=#d699b6,fg=#272e33,bold] #S #[bg=#1e2326] "
set -g status-right "#{?client_prefix,#[bg=#e67e80#,fg=#272e33#,bold] PREFIX #[default] ,}#[fg=#859289]%H:%M #[bg=#83c092,fg=#272e33,bold] #h "
setw -g window-status-format "#[fg=#859289] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#d699b6,bold] #I:#W#{?window_zoomed_flag, #[fg=#7fbbb3]Z#[fg=#d699b6],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#4c565c"
set -g pane-active-border-style "fg=#d699b6"
set -g message-style "bg=#1e2326,fg=#d3c6aa"
set -g mode-style "bg=#d699b6,fg=#272e33"
