# gruvbox dark (medium). bg0 #282828, bg0_h #1d2021, fg #ebdbb2, purple #d3869b,
# blue #83a598, red #fb4934, aqua #8ec07c, gray #928374, bg3 #665c54.
set -g window-style "fg=#ebdbb2,bg=#282828"
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left "#[bg=#d3869b,fg=#282828,bold] #S #[bg=#1d2021] "
set -g status-right "#{?client_prefix,#[bg=#fb4934#,fg=#282828#,bold] PREFIX #[default] ,}#[fg=#928374]%H:%M #[bg=#8ec07c,fg=#282828,bold] #h "
setw -g window-status-format "#[fg=#928374] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#d3869b,bold] #I:#W#{?window_zoomed_flag, #[fg=#83a598]Z#[fg=#d3869b],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#d3869b"
set -g message-style "bg=#1d2021,fg=#ebdbb2"
set -g mode-style "bg=#d3869b,fg=#282828"
