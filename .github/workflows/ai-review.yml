name: AI Review (PR-Agent)

on:
  issue_comment:
    types: [created]

jobs:
  pr-agent:
    # Comment-triggered on a PUBLIC repo: without this guard any GitHub user
    # could spend the API key by commenting on a PR.
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Run PR-Agent
        # Original PR-Agent, transferred from qodo-ai to The-PR-Agent (same repo).
        # Pinned to a SHA: this action receives OPENCODE_API_KEY and a write token.
        uses: The-PR-Agent/pr-agent@01b7e8344672f5f02b76073334151cf2f4099ebc # main @ 2026-08-29
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenCode Go speaks the OpenAI Chat Completions wire format, so LiteLLM
          # routes it through its `openai/` provider. API_BASE decides the vendor;
          # no request goes to openai.com.
          CONFIG.MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENAI.KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI.API_BASE: https://opencode.ai/zen/go/v1
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "128000"
          # Default is 32000 — this is the cap that actually prunes the diff.
          CONFIG.MAX_MODEL_TOKENS: "120000"
          CONFIG.FALLBACK_MODELS: '["openai/deepseek-v4-pro"]'

          # Post findings on the diff lines instead of one summary table.
          PR_REVIEWER.INLINE_KEY_ISSUES: "true"
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "true"

          # On demand only: nothing runs unless a trusted author comments
          # `/review` or `/improve` on the PR.
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "false"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "false"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
