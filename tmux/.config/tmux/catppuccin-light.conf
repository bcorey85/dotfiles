# catppuccin latte. base #eff1f5, mantle #e6e9ef, text #4c4f69, mauve #8839ef,
# blue #1e66f5, red #d20f39, teal #179299, overlay1 #8c8fa1, surface1 #bcc0cc.
set -g window-style "fg=#4c4f69,bg=#eff1f5"
set -g status-style "bg=#e6e9ef,fg=#4c4f69"
set -g status-left "#[bg=#8839ef,fg=#eff1f5,bold] #S #[bg=#e6e9ef] "
set -g status-right "#{?client_prefix,#[bg=#d20f39#,fg=#eff1f5#,bold] PREFIX #[default] ,}#[fg=#8c8fa1]%H:%M #[bg=#179299,fg=#eff1f5,bold] #h "
setw -g window-status-format "#[fg=#8c8fa1] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#8839ef,bold] #I:#W#{?window_zoomed_flag, #[fg=#1e66f5]Z#[fg=#8839ef],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#8839ef"
set -g message-style "bg=#e6e9ef,fg=#4c4f69"
set -g mode-style "bg=#8839ef,fg=#eff1f5"
