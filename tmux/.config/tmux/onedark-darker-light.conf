# onedark light (navarasu's "light" style — the darker family's light side is
# the stock light one; only dark drops to #1f2329). bg #fafafa, status bg1
# #f0f0f0, fg #383a42, purple #a626a4, blue #4078f2, red #e45649, green #50a14f,
# border #dcdcdc. Muted is #696a71, onedark's grey #a0a1a7 darkened 53% toward
# fg: the stock grey is only 2.26:1 on the #f0f0f0 status bar (floor 4.5); this
# is 4.65:1.
set -g window-style "fg=#383a42,bg=#fafafa"
set -g status-style "bg=#f0f0f0,fg=#383a42"
set -g status-left "#[bg=#a626a4,fg=#fafafa,bold] #S #[bg=#f0f0f0] "
set -g status-right "#{?client_prefix,#[bg=#e45649#,fg=#fafafa#,bold] PREFIX #[default] ,}#[fg=#696a71]%H:%M #[bg=#50a14f,fg=#fafafa,bold] #h "
setw -g window-status-format "#[fg=#696a71] #I:#W "
setw -g window-status-current-format "#[fg=#a626a4,bold] #I:#W#{?window_zoomed_flag, #[fg=#4078f2]Z#[fg=#a626a4],} "
set -g pane-border-style "fg=#dcdcdc"
set -g pane-active-border-style "fg=#a626a4"
set -g message-style "bg=#f0f0f0,fg=#383a42"
set -g mode-style "bg=#a626a4,fg=#fafafa"
