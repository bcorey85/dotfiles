# onedark "darker" — the family's dark side. Hex-for-hex with
# tmux/.config/tmux/onedark-darker-dark.conf and nvim's theme-sync FAMILIES
# entry: canvas #1f2329, status inset #181b20, body fg #a0a8b7, muted #858c9a,
# comment/border #535965, purple #bf68d9, blue #4fa6ed, red #e55561,
# green #8ebd6b, yellow #e2b86b, cyan #48b0bd.
#
# syntax_theme is deliberately omitted: tuicr then picks its bundled DARK
# syntax theme from panel_bg, which avoids shipping (and re-tuning) a .tmTheme.
#
# panel_bg only paints when `transparent_background = false`; it is set to the
# terminal canvas so both settings look the same.

panel_bg = "#1f2329"
bg_highlight = "#2f353f"
fg_primary = "#a0a8b7"
fg_secondary = "#858c9a"
fg_dim = "#626a78"

# Diff backgrounds are navarasu/onedark.nvim's own diff.add / diff.delete, so a
# hunk in tuicr and the same hunk in nvim sit on identical tints.
diff_add = "#8ebd6b"
diff_add_bg = "#31392b"
diff_del = "#e55561"
diff_del_bg = "#382b2c"
diff_context = "#a0a8b7"
diff_hunk_header = "#4fa6ed"
expanded_context_fg = "#626a78"

syntax_add_bg = "#31392b"
syntax_del_bg = "#382b2c"

file_added = "#8ebd6b"
file_modified = "#e2b86b"
file_deleted = "#e55561"
file_renamed = "#bf68d9"

reviewed = "#8ebd6b"
pending = "#e2b86b"

comment_note = "#4fa6ed"
comment_suggestion = "#48b0bd"
comment_issue = "#e55561"
comment_praise = "#8ebd6b"

# Focused/unfocused borders mirror tmux's pane-active-border / pane-border.
border_focused = "#bf68d9"
border_unfocused = "#535965"
status_bar_bg = "#181b20"
cursor_color = "#ffffff"
cursor_line_bg = "#2f353f"
branch_name = "#bf68d9"
help_indicator = "#858c9a"

message_info_fg = "#1f2329"
message_info_bg = "#4fa6ed"
message_warning_fg = "#1f2329"
message_warning_bg = "#e2b86b"
message_error_fg = "#1f2329"
message_error_bg = "#e55561"
update_badge_fg = "#1f2329"
update_badge_bg = "#e2b86b"

# Same inversion as tmux's mode-style.
mode_fg = "#1f2329"
mode_bg = "#bf68d9"
