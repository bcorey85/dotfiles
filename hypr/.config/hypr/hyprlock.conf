# vitesse dark palette (dark-only, no mode axis).
background {
    monitor =
    color = rgb(121212)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(5eaab5)
    inner_color = rgb(181818)
    font_color = rgb(c8c5b8)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    fail_color = rgb(cb7676)
    fail_text = <i>$FAIL</i>
    halign = center
    valign = center
    position = 0, -50
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgb(5eaab5)
    font_size = 64
    font_family = FiraCode Nerd Font Mono
    halign = center
    valign = center
    position = 0, 100
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(83827d)
    font_size = 16
    font_family = FiraCode Nerd Font Mono
    halign = center
    valign = center
    position = 0, 30
}
