# onedark "darker" (#1f2329). bg #1f2329, inset #181b20, fg #a0a8b7,
# purple #bf68d9, blue #4fa6ed, red #e55561, green #8ebd6b, border #535965.
# Muted is the comment #535965 lifted 65% toward body fg (stock is 2.24:1 on the
# canvas, 2.6 on the bar) — the same lift nvim's fixup applies.
set -g window-style "fg=#a0a8b7,bg=#1f2329"
set -g status-style "bg=#181b20,fg=#a0a8b7"
set -g status-left "#[bg=#bf68d9,fg=#1f2329,bold] #S #[bg=#181b20] "
set -g status-right "#{?client_prefix,#[bg=#e55561#,fg=#1f2329#,bold] PREFIX #[default] ,}#[fg=#858c9a]%H:%M #[bg=#8ebd6b,fg=#1f2329,bold] #h "
setw -g window-status-format "#[fg=#858c9a] #I:#W #{?@workmux_status, #{@workmux_status},}"
setw -g window-status-current-format "#[fg=#bf68d9,bold] #I:#W#{?window_zoomed_flag, #[fg=#4fa6ed]Z#[fg=#bf68d9],} #{?@workmux_status, #{@workmux_status},}"
set -g pane-border-style "fg=#535965"
set -g pane-active-border-style "fg=#bf68d9"
set -g message-style "bg=#181b20,fg=#a0a8b7"
set -g mode-style "bg=#bf68d9,fg=#1f2329"
