# kanagawa "lotus" — the family's light side. Hex-for-hex with
# tmux/.config/tmux/kanagawa-light.conf: canvas #f2ecbc, status inset #e5ddb0,
# fg #545464, border #8a8980, purple #624c83, blue #4d699b, red #b44356,
# green #616e59, yellow #706b46, cyan #576e70.
#
# lotus's stock accents mostly sit under the 4.5:1 floor on #f2ecbc and are
# floored toward fg the same way tmux/.config/tmux/kanagawa-light.conf
# documents (blue and purple already clear it and are used stock).
#
# Muted (fg_secondary) is lotusGray3 #8a8980 lifted 60% toward fg: 2.93:1
# stock -> 4.53:1 on the canvas #f2ecbc, where fg_secondary actually renders.
# help_indicator renders on status_bar_bg #e5ddb0 instead, where the same
# #6a696f is only 3.96:1 — under floor. help_indicator is lifted further, to
# #5f5f6a (~80% toward fg): 4.59:1 on the bar, 5.25:1 on the canvas.
#
# syntax_theme omitted so tuicr resolves its bundled LIGHT syntax theme from
# panel_bg.

panel_bg = "#f2ecbc"
bg_highlight = "#e5ddb0"
fg_primary = "#545464"
fg_secondary = "#6a696f"
fg_dim = "#8a8980"

diff_add = "#616e59"
diff_add_bg = "#e3e6d3"
diff_del = "#b44356"
diff_del_bg = "#f1dcda"
diff_context = "#545464"
diff_hunk_header = "#4d699b"
expanded_context_fg = "#8a8980"

syntax_add_bg = "#e3e6d3"
syntax_del_bg = "#f1dcda"

file_added = "#616e59"
file_modified = "#8e6034"
file_deleted = "#b44356"
file_renamed = "#624c83"

reviewed = "#616e59"
pending = "#8e6034"

comment_note = "#4d699b"
comment_suggestion = "#576e70"
comment_issue = "#b44356"
comment_praise = "#616e59"

border_focused = "#624c83"
border_unfocused = "#8a8980"
status_bar_bg = "#e5ddb0"
cursor_color = "#000000"
cursor_line_bg = "#e5ddb0"
branch_name = "#624c83"
help_indicator = "#5f5f6a"

message_info_fg = "#f2ecbc"
message_info_bg = "#4d699b"
message_warning_fg = "#f2ecbc"
message_warning_bg = "#8e6034"
message_error_fg = "#f2ecbc"
message_error_bg = "#b44356"
update_badge_fg = "#f2ecbc"
update_badge_bg = "#8e6034"

mode_fg = "#f2ecbc"
